name: Validate catalog

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-catalog.mjs
      - run: node scripts/generate-readme.mjs
      - run: git diff --exit-code README.md
